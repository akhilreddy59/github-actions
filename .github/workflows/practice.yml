name: Student Management CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript syntax
        run: node --check studentManagement/script.js

      - name: Lint HTML files
        run: npx htmlhint "studentManagement/*.html"

      - name: Lint CSS files
        run: |
          echo '{"rules": {"color-no-invalid-hex": true}}' > .stylelintrc.json
          npx stylelint "studentManagement/*.css"