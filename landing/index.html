<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKHIL REDDY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <div class="spotlight" id="spotlight" aria-hidden="true"></div>

  <header class="nav">
    <a class="brand" href="#top">AR</a>
    <nav class="nav-links">
      <a href="#about">About</a>
      <a href="#work">Work</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main class="hero" id="top">
    <p class="kicker">Hello, I am</p>

    <h1 class="name" aria-label="Akhil Reddy">
      <span class="name-line" id="name-line"></span>
    </h1>

    <p class="tagline">
      <span id="typed"></span><span class="caret" aria-hidden="true"></span>
    </p>

    <div class="actions">
      <a class="btn btn-primary magnetic" href="#work">View Work</a>
      <a class="btn btn-ghost magnetic" href="#contact">Get in Touch</a>
    </div>
  </main>

  <a class="scroll-hint" href="#about" aria-label="Scroll down">
    <span class="mouse"></span>
  </a>

  <section class="panel" id="about">
    <h2 class="reveal">About</h2>
    <p class="reveal">Building playful, fast interfaces with a focus on motion and detail.</p>
  </section>

  <section class="panel" id="work">
    <h2 class="reveal">Work</h2>
    <p class="reveal">Selected projects, experiments and things I am proud of.</p>
  </section>

  <section class="panel" id="contact">
    <h2 class="reveal">Contact</h2>
    <p class="reveal">Say hello at <a href="mailto:hello@akhilreddy.dev">hello@akhilreddy.dev</a></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
